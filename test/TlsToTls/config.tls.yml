# TlsToTls：TLS 客户端 -> 代理 -> TLS 后端
#
# 端口 1200 = 代理监听
# 证书路径是相对路径，**必须在本目录下启动代理**，否则解析不到。
# 其余配置项一律走代码默认值。
# 完整配置项参考见 ../../README.md 的「配置项参考」。

config:
  tls:
    enable: true
  log:
    level: debug
  threadpool:
    # TLS 每连接只占 1 个 worker，但握手阶段占 2 个，给足余量
    maxWokers: 200

server:
  host: 0.0.0.0
  port: 1200
  tls:
    cert: proxy.crt
    privkey: proxy.key

client:
  host: "www.baidu.com"
  port: 443
  socket:
    # TLS 模式低于 8192 会打性能告警
    bufferSize: 8192
  tls:
    # 要和后端证书的 CN/SAN 一致
    sni: "www.baidu.com"
    # 后端 CA bundle。必须写 "" 或真正的 CA 集合，
    # **不能写 server.tls.cert 那个自签叶子证书** —— 那是代理自己的证书，
    # 验不了公共 CA 签发的后端证书。留空则只依赖 OpenSSL 默认信任库，
    # Windows 上默认为空，那样所有后端握手都会以 "certificate verify failed" 失败。
    cert: ca-bundle.crt
