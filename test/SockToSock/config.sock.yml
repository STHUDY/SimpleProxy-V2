# SockToSock：明文客户端 -> 代理 -> 明文后端
#
# 端口 19800 = 代理监听，19801 = 后端
# 其余配置项一律走代码默认值，不在此重复声明。
# 完整配置项参考见 ../../README.md 的「配置项参考」。

config:
  log:
    # 默认就是 debug，写出来是为了让测试失败时能直接看日志定位
    level: debug
  threadpool:
    minWokers: 10
    maxWokers: 1000
server:
  host: 127.0.0.1
  port: 9800

client:
  host: 127.0.0.1
  port: 10808
