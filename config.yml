config:
  socket:
    ioUseMode: none # 仅支持 none
    useThreadpoolAccept: true
    noBlockReadOrWrite: false # 未实现，无效果
    noBlockConnect: false # 未实现，无效果
    acceptTimeoutMs: 5000
    connectTimeoutMs: 5000
    pollingIntervalMs: 100
    readOrWriteTimeoutMs: 5000
  tls:
    enable: false # 如果要处理HTTPS/TLS流量，请设置为true，并确保cert和key文件存在
    socketIoUseMode: none
    sslIoUseMode: none
    useThreadpoolAccept: true
    useThreadpoolSslAccept: true
    noBlockReadOrWrite: false # 未实现，无效果
    noBlockConnect: false # 未实现，无效果
    acceptTimeoutMs: 5000
    connectTimeoutMs: 5000
    pollingIntervalMs: 100
    readOrWriteTimeoutMs: 5000
  log:
    enable: true
    console: true
    file: false
    level: info
    filePath: "./proxy.log"
  threadpool:
    minWokers: 10
    maxWokers: 1000
    clearThreadTimeMs: 60000
    pollingIntervalMs: 1000
    stepAddThreadNumber: 10
server:
  host: 0.0.0.0
  port: 9800
  socket:
    bufferSize: 1024
    maxBacklog: 128
  tls:
    cert: cert.pem # TLS证书文件路径（当tls.enable=true时必需）
    privkey: key.pem # TLS私钥文件路径（当tls.enable=true时必需，键名是 privkey）
  connect:
    banIps: []
    allowedIps: []
client:
  host: [0.0.0.0]  # 支持数组: [0.0.0.0, 0.0.0.0]
  port: [10808]    # 支持数组: [10808, 12080]
  selectMode: roundRobin  # 选择模式: roundRobin (轮询) 或 random (随机)
  socket:
    bufferSize: 1024
  tls:
    hostname: 0.0.0.0 # 已废弃，未被使用
    sni: # SNI扩展，留空则透传客户端握手SNI；0.0.0.0/localhost 无法作为SNI，会导致后端证书主机名校验被关闭
    cert: # CA证书文件路径（已废弃，未被使用）
